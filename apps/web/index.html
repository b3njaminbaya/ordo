<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordo</title>
    <meta name="description" content="Self-hosted project management software. Tasks, Kanban, calendar, time tracking and real-time collaboration — one-time license, hosted on your own server." />
    <meta name="theme-color" content="#6366F1" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ordo — self-hosted project management" />
    <meta property="og:description" content="Buy once, deploy on your own infrastructure, keep your data. Tasks, Kanban, calendar, time tracking and team collaboration." />
    <!-- Apply theme before first paint to prevent flash of wrong theme -->
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (t === 'dark' || (!t && prefersDark) || (t === 'system' && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
