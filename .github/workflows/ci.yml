name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  # Turborepo remote cache (optional — set TURBO_TOKEN + TURBO_TEAM in repo secrets)
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ── Frontend + packages ───────────────────────────────────────────────────
  web:
    name: Web (build + lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo cache restore
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build
        run: pnpm turbo build --filter=@ordo/web...

      - name: Lint
        run: pnpm turbo lint --filter=@ordo/web...

      - name: Test
        run: pnpm --filter @ordo/web test

  # ── Backend ───────────────────────────────────────────────────────────────
  api:
    name: API (lint + test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8 — syntax errors and undefined names fail the build)
        run: |
          pip install flake8
          flake8 . --exclude .venv,task,migrations --select E9,F63,F7,F82

      - name: Test (pytest)
        # tests/conftest.py forces an in-memory SQLite database and test secrets.
        run: |
          pip install pytest
          python -m pytest tests/ -v
